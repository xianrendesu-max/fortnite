<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aim & Movement Practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  overflow: hidden;
  background: linear-gradient(#7ecbff, #eaf7ff);
  font-family: Arial, sans-serif;
  touch-action: none;
}

/* HUD */
#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  color: white;
  font-size: 15px;
  text-shadow: 0 0 6px #000;
  z-index: 10;
  line-height: 1.4;
}

#score {
  position: fixed;
  top: 12px;
  right: 16px;
  font-size: 22px;
  color: #ffeb3b;
  text-shadow: 0 0 8px #000;
  z-index: 10;
}

/* Crosshair */
#crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 26px;
  height: 26px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 5;
}
#crosshair::before,
#crosshair::after {
  content: "";
  position: absolute;
  background: white;
}
#crosshair::before {
  width: 26px;
  height: 2px;
  top: 12px;
}
#crosshair::after {
  width: 2px;
  height: 26px;
  left: 12px;
}

/* Damage text */
.damage {
  position: fixed;
  color: red;
  font-weight: bold;
  font-size: 20px;
  pointer-events: none;
  text-shadow: 0 0 6px black;
}
</style>
</head>

<body>

<div id="hud">
MOVE: WASD<br>
JUMP: SPACE<br>
DASH: SHIFT<br>
SLIDE: CTRL<br>
SHOOT: CLICK
</div>

<div id="score">SCORE: 0</div>
<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ===============================
   Scene / Camera / Renderer
=============================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

/* ===============================
   Light
=============================== */
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(10, 20, 10);
scene.add(sun);

/* ===============================
   Terrain（起伏）
=============================== */
const terrainGeo = new THREE.PlaneGeometry(300, 300, 60, 60);
for (let i = 0; i < terrainGeo.attributes.position.count; i++) {
  const y = Math.sin(i / 4) * 1.2 + Math.cos(i / 7) * 1.5;
  terrainGeo.attributes.position.setY(i, y);
}
terrainGeo.computeVertexNormals();

const terrain = new THREE.Mesh(
  terrainGeo,
  new THREE.MeshStandardMaterial({ color: 0x4caf50 })
);
terrain.rotation.x = -Math.PI / 2;
scene.add(terrain);

/* ===============================
   Player Movement
=============================== */
const player = {
  velocity: new THREE.Vector3(),
  direction: new THREE.Vector3(),
  speed: 0.08,
  dashSpeed: 0.18,
  slideSpeed: 0.22,
  jumpPower: 0.22,
  gravity: 0.012,
  onGround: false,
  isDashing: false,
  isSliding: false,
  dashTime: 0,
  slideTime: 0
};

const keys = {};
addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup", e => keys[e.code] = false);

addEventListener("keydown", e => {
  if (e.code === "Space" && player.onGround) {
    player.velocity.y = player.jumpPower;
    player.onGround = false;
  }
  if (e.code === "ShiftLeft" && player.onGround) {
    player.isDashing = true;
    player.dashTime = 12;
  }
  if (e.code === "ControlLeft" && player.onGround) {
    player.isSliding = true;
    player.slideTime = 20;
  }
});

/* ===============================
   Camera View
=============================== */
let yaw = 0, pitch = 0;
document.body.addEventListener("click", () => {
  document.body.requestPointerLock();
});

document.addEventListener("mousemove", e => {
  if (document.pointerLockElement === document.body) {
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
    camera.rotation.set(pitch, yaw, 0);
  }
});

/* ===============================
   BOT
=============================== */
const bots = [];
function spawnBot() {
  const bot = new THREE.Mesh(
    new THREE.SphereGeometry(0.6, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0x2196f3 })
  );
  bot.position.set(
    (Math.random() - 0.5) * 60,
    3,
    (Math.random() - 0.5) * 60
  );
  bot.hp = 100;
  bot.dir = Math.random() * Math.PI * 2;
  bot.speed = 0.02;
  scene.add(bot);
  bots.push(bot);
}

for (let i = 0; i < 8; i++) spawnBot();

/* ===============================
   Score
=============================== */
let score = 0;
const scoreEl = document.getElementById("score");

/* ===============================
   Shoot & Hit Detection
=============================== */
const raycaster = new THREE.Raycaster();

document.addEventListener("mousedown", () => {
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const hits = raycaster.intersectObjects(bots);

  if (hits.length > 0) {
    const bot = hits[0].object;
    bot.hp -= 50;
    showDamage("50", hits[0].point);

    if (bot.hp <= 0) {
      scene.remove(bot);
      bots.splice(bots.indexOf(bot), 1);
      score++;
      scoreEl.textContent = "SCORE: " + score;
      spawnBot();
    }
  }
});

/* ===============================
   Damage Text
=============================== */
function showDamage(text, worldPos) {
  const div = document.createElement("div");
  div.className = "damage";
  div.textContent = text;
  document.body.appendChild(div);

  const pos = worldPos.clone().project(camera);
  div.style.left = ((pos.x + 1) / 2 * innerWidth) + "px";
  div.style.top = ((-pos.y + 1) / 2 * innerHeight) + "px";

  let y = parseFloat(div.style.top);
  let opacity = 1;

  const anim = setInterval(() => {
    y -= 1;
    opacity -= 0.05;
    div.style.top = y + "px";
    div.style.opacity = opacity;
    if (opacity <= 0) {
      clearInterval(anim);
      div.remove();
    }
  }, 16);
}

/* ===============================
   Update Loop
=============================== */
function update() {
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();

  const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
  player.direction.set(0, 0, 0);

  if (keys["KeyW"]) player.direction.add(forward);
  if (keys["KeyS"]) player.direction.add(forward.clone().negate());
  if (keys["KeyA"]) player.direction.add(right.clone().negate());
  if (keys["KeyD"]) player.direction.add(right);

  let speed = player.speed;
  if (player.isDashing && player.dashTime-- > 0) speed = player.dashSpeed;
  if (player.isSliding && player.slideTime-- > 0) speed = player.slideSpeed;

  camera.position.add(player.direction.multiplyScalar(speed));

  player.velocity.y -= player.gravity;
  camera.position.y += player.velocity.y;

  raycaster.set(camera.position, new THREE.Vector3(0, -1, 0));
  const hit = raycaster.intersectObject(terrain);
  if (hit.length > 0 && hit[0].distance < 1.7) {
    camera.position.y = hit[0].point.y + 1.6;
    player.velocity.y = 0;
    player.onGround = true;
  } else player.onGround = false;

  bots.forEach(bot => {
    bot.dir += (Math.random() - 0.5) * 0.05;
    bot.position.x += Math.cos(bot.dir) * bot.speed;
    bot.position.z += Math.sin(bot.dir) * bot.speed;
    raycaster.set(bot.position, new THREE.Vector3(0, -1, 0));
    const h = raycaster.intersectObject(terrain);
    if (h.length > 0) bot.position.y = h[0].point.y + 0.6;
  });
}

/* ===============================
   Loop
=============================== */
function animate() {
  requestAnimationFrame(animate);
  update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
