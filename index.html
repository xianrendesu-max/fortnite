<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Fortnite Style Aim World</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  overflow: hidden;
  background: linear-gradient(#7ecbff, #eaf7ff);
  font-family: Arial, sans-serif;
  touch-action: none;
}

/* HUD */
#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  color: white;
  font-size: 16px;
  text-shadow: 0 0 6px #000;
  z-index: 10;
}

/* Crosshair */
#crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 24px;
  height: 24px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 5;
}
#crosshair::before,
#crosshair::after {
  content: "";
  position: absolute;
  background: white;
}
#crosshair::before {
  width: 24px;
  height: 2px;
  top: 11px;
}
#crosshair::after {
  width: 2px;
  height: 24px;
  left: 11px;
}

/* Mobile shoot */
#buildBtn {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(#4caf50, #2e7d32);
  color: white;
  font-size: 18px;
  box-shadow: 0 6px 0 #1b5e20;
  z-index: 20;
}
.hidden { display: none; }
</style>
</head>

<body>

<div id="hud">
  MODE: <span id="mode">MOVE</span><br>
  OBJ: <span id="obj">WALL</span>
</div>

<div id="crosshair"></div>
<button id="buildBtn" class="hidden">BUILD</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ===============================
   デバイス判定
=============================== */
const isMobile = /iPhone|Android|iPad/i.test(navigator.userAgent);
const buildBtn = document.getElementById("buildBtn");
if (isMobile) buildBtn.classList.remove("hidden");

/* ===============================
   Scene
=============================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

/* ===============================
   Light
=============================== */
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(5, 10, 5);
scene.add(sun);

/* ===============================
   Floor
=============================== */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x4caf50 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

/* ===============================
   プレイヤー（ジャンプ＆ダッシュ）
=============================== */
const player = {
  velocity: new THREE.Vector3(),
  direction: new THREE.Vector3(),

  speed: 0.08,
  dashSpeed: 0.18,
  jumpPower: 0.22,
  gravity: 0.012,

  onGround: false,

  isDashing: false,
  dashTime: 0,
  maxDashTime: 12,
  dashCooldown: 0,
  maxDashCooldown: 40
};

const keys = {};
addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup", e => keys[e.code] = false);

addEventListener("keydown", e => {
  if (e.code === "Space" && player.onGround) {
    player.velocity.y = player.jumpPower;
    player.onGround = false;
  }

  if (e.code === "ShiftLeft") {
    if (player.onGround && !player.isDashing && player.dashCooldown <= 0) {
      player.isDashing = true;
      player.dashTime = player.maxDashTime;
      player.dashCooldown = player.maxDashCooldown;
    }
  }
});

function updatePlayer() {
  player.direction.set(0, 0, 0);

  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();

  const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();

  if (keys["KeyW"]) player.direction.add(forward);
  if (keys["KeyS"]) player.direction.add(forward.clone().negate());
  if (keys["KeyA"]) player.direction.add(right.clone().negate());
  if (keys["KeyD"]) player.direction.add(right);

  if (player.direction.length() > 0) {
    player.direction.normalize();
  }

  let currentSpeed = player.speed;

  if (player.isDashing) {
    currentSpeed = player.dashSpeed;
    player.dashTime--;
    if (player.dashTime <= 0) player.isDashing = false;
  }

  if (player.dashCooldown > 0) player.dashCooldown--;

  camera.position.add(player.direction.clone().multiplyScalar(currentSpeed));

  player.velocity.y -= player.gravity;
  camera.position.y += player.velocity.y;

  if (camera.position.y <= 1.6) {
    camera.position.y = 1.6;
    player.velocity.y = 0;
    player.onGround = true;
  }
}

/* ===============================
   視点操作
=============================== */
let yaw = 0, pitch = 0;
const sensitivity = isMobile ? 0.003 : 0.002;

function updateCamera() {
  pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
  camera.rotation.set(pitch, yaw, 0);
}

if (!isMobile) {
  document.body.addEventListener("click", () => document.body.requestPointerLock());
  document.addEventListener("mousemove", e => {
    if (document.pointerLockElement === document.body) {
      yaw   -= e.movementX * sensitivity;
      pitch -= e.movementY * sensitivity;
      updateCamera();
    }
  });
}

/* ===============================
   オブジェクト配置
=============================== */
let buildMode = false;
let buildType = "wall";
const objects = [];
const raycaster = new THREE.Raycaster();
const center = new THREE.Vector2(0, 0);

addEventListener("keydown", e => {
  if (e.code === "KeyB") buildMode = !buildMode;
  if (e.code === "Digit1") buildType = "wall";
  if (e.code === "Digit2") buildType = "box";
  if (e.code === "Digit3") buildType = "rock";
  document.getElementById("mode").textContent = buildMode ? "BUILD" : "MOVE";
  document.getElementById("obj").textContent = buildType.toUpperCase();
});

function createObject(pos, type) {
  let geo, mat;

  if (type === "wall") {
    geo = new THREE.BoxGeometry(2, 2, 0.2);
    mat = new THREE.MeshStandardMaterial({ color: 0x3fa9f5 });
  }
  if (type === "box") {
    geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    mat = new THREE.MeshStandardMaterial({ color: 0x9e9e9e });
  }
  if (type === "rock") {
    geo = new THREE.DodecahedronGeometry(1.2);
    mat = new THREE.MeshStandardMaterial({ color: 0x6d6d6d });
  }

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  scene.add(mesh);
  objects.push(mesh);
}

function placeObject() {
  if (!buildMode) return;

  raycaster.setFromCamera(center, camera);
  const hit = raycaster.intersectObject(floor);

  if (hit.length > 0) {
    const p = hit[0].point.clone();
    p.x = Math.round(p.x / 2) * 2;
    p.z = Math.round(p.z / 2) * 2;
    p.y += 1;
    createObject(p, buildType);
  }
}

addEventListener("click", placeObject);
buildBtn.addEventListener("click", () => buildMode = !buildMode);

/* ===============================
   Loop
=============================== */
function animate() {
  requestAnimationFrame(animate);

  updatePlayer();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
